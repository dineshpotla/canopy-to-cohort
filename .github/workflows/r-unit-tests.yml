name: R data-free unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install unit-test dependencies
        shell: Rscript {0}
        run: |
          install.packages(c(
            "testthat", "dplyr", "tibble", "readr", "here", "yaml"
          ))

      - name: Run data-free unit tests
        run: >-
          Rscript --vanilla -e
          'testthat::test_dir("tests/testthat", reporter = "summary")'
