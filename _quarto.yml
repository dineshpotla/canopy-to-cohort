project:
  type: website
  output-dir: _site
  resources:
    - research/**
    - "!research/notes/browse-data-request-draft.md"
    - docs/recruitment-reproducibility.md
  render:
    - index.qmd
    - report/index.qmd
    - report/recruitment.qmd
    - report/ri-audit.qmd
    - report/length-study.qmd
    - docs/research-direction.md
    - docs/survey-validation-plan.md
    - docs/analysis-decisions.md
    - docs/data-dictionary.md

website:
  title: "Canopy to Cohort"
  description: "Sugar-maple recruitment in Michigan FIA: audited sapling entry, linked-stem fates, and held-out comparisons of regeneration indicators."
  site-url: "https://dineshpotla.github.io/canopy-to-cohort/"
  repo-url: "https://github.com/dineshpotla/canopy-to-cohort"
  repo-actions: [source, issue]
  open-graph: true
  twitter-card: true
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: report/recruitment.qmd
        text: Recruitment study
      - href: report/index.qmd
        text: Detection pilot
      - href: docs/research-direction.md
        text: Research direction
      - href: docs/analysis-decisions.md
        text: Analysis decisions
      - href: docs/data-dictionary.md
        text: Data dictionary
    right:
      - icon: github
        href: "https://github.com/dineshpotla/canopy-to-cohort"
        aria-label: GitHub repository

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    code-fold: true
    code-tools: true
    embed-resources: false

execute:
  freeze: false
  warning: false
  message: false
